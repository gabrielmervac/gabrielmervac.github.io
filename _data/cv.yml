    Experience:
      - company: University of Chicago — Pritzker School of Molecular Engineering
        position: Postdoctoral Researcher (Laboratory of Prof. Savaş Tay)
        location: Chicago, IL
        start_date: 2022
        highlights:
          - Combined microfluidic technology with fluorescence microscopy to study the response of immune cells to transient perturbations
          - Developed mathematical models of immune-response dynamics in infectious disease and cell-to-cell communication
          - Built machine-learning and deep-learning models (including LSTM networks) to predict the evolution of the immune response
          - Collaborated across biology, chemistry, materials science, and physics to build a microfluidic platform for high-throughput antibiotic screening
          - Contributed to a ~$500,000 grant from the Chan Zuckerberg Biohub

      - company: National Autonomous University of Mexico — Institute of Physics
        position: Doctoral Researcher (Laboratory of Prof. Denis Boyer)
        location: Mexico City, Mexico
        start_date: 2018
        end_date: 2022
        highlights:
          - Studied the statistical properties of first-passage times of random searches in fluctuating environments
          - Collaborated internationally to build models implementing stochastic resetting to optimize random searches
          - Investigated population dynamics in a predator–prey system by integrating spatial mobility

      - company: University Paris-Saclay — LPTMS
        position: Summer Graduate Researcher (Laboratory of Prof. Satya Majumdar)
        location: Paris, France
        start_date: 2022
        end_date: 2022
        highlights:
          - Studied the distribution of arrival times to an absorbing target by a finite-lived searcher

      - company: National Autonomous University of Mexico — Institute of Physics
        position: Undergraduate Researcher (Laboratory of Prof. Jorge Alfonso García Macedo)
        location: Mexico City, Mexico
        start_date: 2014
        end_date: 2018
        highlights:
          - Automated an optical setup to measure the nonlinear optical properties of organic materials

